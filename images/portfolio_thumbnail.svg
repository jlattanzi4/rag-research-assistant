<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a"/>
      <stop offset="50%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f0f1a"/>
    </linearGradient>
    <linearGradient id="hero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(99,102,241,0.15)"/>
      <stop offset="100%" style="stop-color:rgba(34,211,238,0.08)"/>
    </linearGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="50%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
    <linearGradient id="userMsg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
    <linearGradient id="badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(34,211,238,0.3)"/>
      <stop offset="100%" style="stop-color:rgba(99,102,241,0.3)"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="orb1" cx="20%" cy="20%" r="50%">
      <stop offset="0%" style="stop-color:rgba(99,102,241,0.2)"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </radialGradient>
    <radialGradient id="orb2" cx="80%" cy="80%" r="50%">
      <stop offset="0%" style="stop-color:rgba(34,211,238,0.15)"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Ambient orbs -->
  <ellipse cx="160" cy="100" rx="200" ry="200" fill="url(#orb1)"/>
  <ellipse cx="640" cy="400" rx="250" ry="200" fill="url(#orb2)"/>

  <!-- Hero Card -->
  <rect x="40" y="30" width="720" height="140" rx="20" fill="url(#hero)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="40" y1="31" x2="760" y2="31" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>

  <!-- Title -->
  <text x="60" y="80" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="700" fill="url(#title)">RAG Research Assistant</text>
  <text x="60" y="110" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#94a3b8">Intelligent Document Analysis Powered by AI</text>

  <!-- Tech badges -->
  <g font-family="JetBrains Mono, monospace" font-size="10">
    <rect x="60" y="125" width="52" height="24" rx="6" fill="rgba(99,102,241,0.2)" stroke="rgba(99,102,241,0.4)" stroke-width="1"/>
    <text x="70" y="141" fill="#a5b4fc">Python</text>

    <rect x="120" y="125" width="70" height="24" rx="6" fill="rgba(99,102,241,0.2)" stroke="rgba(99,102,241,0.4)" stroke-width="1"/>
    <text x="130" y="141" fill="#a5b4fc">LangChain</text>

    <rect x="198" y="125" width="65" height="24" rx="6" fill="rgba(99,102,241,0.2)" stroke="rgba(99,102,241,0.4)" stroke-width="1"/>
    <text x="208" y="141" fill="#a5b4fc">Llama 3.1</text>

    <rect x="271" y="125" width="70" height="24" rx="6" fill="rgba(99,102,241,0.2)" stroke="rgba(99,102,241,0.4)" stroke-width="1"/>
    <text x="281" y="141" fill="#a5b4fc">ChromaDB</text>
  </g>

  <!-- Chat Interface -->
  <!-- User message -->
  <rect x="350" y="195" width="390" height="50" rx="16" fill="url(#userMsg)" filter="url(#glow)"/>
  <text x="370" y="227" font-family="Inter, system-ui, sans-serif" font-size="13" fill="white">What are the key benefits of RAG systems?</text>

  <!-- Assistant message -->
  <rect x="60" y="260" width="520" height="120" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="80" y="290" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#f8fafc">RAG systems offer several key advantages:</text>
  <text x="80" y="312" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94a3b8">1. Reduced hallucinations through grounded responses</text>
  <text x="80" y="332" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94a3b8">2. Access to domain-specific, up-to-date information</text>
  <text x="80" y="352" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94a3b8">3. Transparent source citations for verification</text>

  <!-- Response time badge -->
  <rect x="80" y="395" width="120" height="26" rx="13" fill="rgba(34,211,238,0.15)" stroke="rgba(34,211,238,0.3)" stroke-width="1"/>
  <text x="100" y="413" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#22d3ee">Generated in 1.2s</text>

  <!-- Source card preview -->
  <rect x="60" y="435" width="300" height="50" rx="0" fill="rgba(99,102,241,0.1)"/>
  <rect x="60" y="435" width="3" height="50" fill="#6366f1"/>
  <text x="75" y="458" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#f8fafc">Source 1: ml_fundamentals.pdf</text>
  <rect x="235" y="448" width="60" height="18" rx="9" fill="url(#badge)"/>
  <text x="246" y="461" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#22d3ee">94% match</text>
  <text x="75" y="476" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#64748b">Retrieval-Augmented Generation combines...</text>

  <!-- Sidebar indicator -->
  <rect x="700" y="195" width="80" height="280" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <!-- Status dot -->
  <circle cx="740" cy="220" r="5" fill="#22c55e">
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="715" y="245" font-family="Inter, system-ui, sans-serif" font-size="9" fill="#94a3b8">Online</text>

  <!-- Stat box -->
  <rect x="710" y="260" width="60" height="50" rx="8" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.2)" stroke-width="1"/>
  <text x="725" y="287" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#6366f1">24</text>
  <text x="716" y="302" font-family="Inter, system-ui, sans-serif" font-size="7" fill="#94a3b8">INDEXED</text>
</svg>